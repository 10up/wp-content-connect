name: WordPress Plugin Checks

on:
  push:
    branches:
      - develop
      - trunk
      - master
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build:
    uses: 10up/wp-content-connect/.github/workflows/build-release-zip.yml@develop

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download built zip
        uses: actions/download-artifact@b14cf4c92620c250e1c074ab0a5800e37df86765 # v4.2.0
        with:
          name: ${{ github.event.repository.name }}
          path: artifact

      - name: Extract built zip
        run: |
          mkdir -p "${{ github.event.repository.name }}"
          unzip -q "artifact/${{ github.event.repository.name }}.zip" -d "${{ github.event.repository.name }}"

      - name: Display structure of downloaded files
        run: ls -R
        working-directory: ${{ github.event.repository.name }}

      - name: Run plugin check
        uses: wordpress/plugin-check-action@98a1788320d0add90df2d8183934ecccbc4e05d2 # v1.1.7
        with:
          build-dir: ${{ github.event.repository.name }}
          exclude-checks: 'plugin_readme,plugin_updater' # Plugin isn't on .org so excluding these for now.
          exclude-directories: 'assets,dist,vendor'
          exclude-files: 'includes/Helpers.php' # Composer files-autoloaded API; an ABSPATH exit guard would break autoloading outside WordPress.
          ignore-warnings: true
