name: Test E2E

env:
  COMPOSER_VERSION: "2"
  COMPOSER_CACHE: "${{ github.workspace }}/.composer-cache"

on:
  push:
    branches:
      - develop
      - trunk
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test-e2e:
    name: Playwright E2E (${{ matrix.wp.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wp:
          # The core pinned in .wp-env.json, which ships @wordpress/boot.
          - name: WordPress 7.0
            core: ''
          # Without boot, the relationships screen edits in a slide-out panel.
          - name: WordPress 6.9
            core: WordPress/WordPress#6.9.9
    steps:
      - name: Check out our repo source code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set standard 10up cache directories
        run: |
          composer config -g cache-dir "${{ env.COMPOSER_CACHE }}"

      - name: Prepare composer cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: ${{ env.COMPOSER_CACHE }}
          key: composer-${{ env.COMPOSER_VERSION }}-e2e-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ env.COMPOSER_VERSION }}-e2e-

      - name: Set PHP version
        uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # v2.32.0
        with:
          php-version: '8.2'
          extensions: :php-psr
          coverage: none

      - name: Set Node version
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Playwright needs its optional deps, so do NOT pass --omit=optional here.
      - name: Install Node dependencies
        run: npm ci

      - name: Install Composer dependencies
        run: composer install --ignore-platform-reqs

      # The editor bundle must exist before wp-env starts, otherwise
      # BlockEditor.php enqueues nothing and every relationship panel is empty.
      - name: Build assets
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Override the WordPress version
        if: matrix.wp.core != ''
        run: |
          echo '{ "core": "${{ matrix.wp.core }}" }' > .wp-env.override.json

      # afterStart in .wp-env.json seeds the example data; global-setup re-seeds idempotently.
      - name: Start wp-env
        run: npm run wp-env:start

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: playwright-results-${{ matrix.wp.name }}
          path: tests/e2e/test-results/
          retention-days: 7
