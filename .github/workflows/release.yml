name: Release

# develop: changesets are versioned in pre-release mode (`X.Y.Z-beta.N`). The
#   changeset files stay, so they carry over to trunk. Each push with new
#   changesets publishes a GitHub prerelease.
# trunk:   pre-release mode is exited and the changesets are consumed into the
#   final version and changelog. That's published as a release, then trunk is
#   merged back into develop so the next pre-releases start from it.
#
# Both commit the version bump to the source branch as `chore: apply
# changesets`. The plugin is then built, and the source plus dist/ is committed
# onto the `built` branch and tagged `X.Y.Z[-beta.N]`. Tags are what Composer
# and git installs resolve to, so they always contain a working plugin, while
# develop and trunk never contain build output. The release zip is a
# `git archive` of the tag (honoring .gitattributes export-ignore).

on:
  push:
    branches: [develop, trunk]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  BUILT_BRANCH: built

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Commits this workflow pushes must not start another release.
    if: |
      github.event.head_commit.message != 'chore: apply changesets' &&
      github.event.head_commit.message != 'chore: merge trunk into develop'
    env:
      IS_TRUNK: ${{ github.ref_name == 'trunk' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check for changesets
        id: changesets
        run: |
          if ls .changeset/*.md | grep -v README.md > /dev/null 2>&1; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup node
        if: steps.changesets.outputs.pending == 'true'
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply changesets
        id: version
        if: steps.changesets.outputs.pending == 'true'
        run: |
          npm ci
          BEFORE=$(node -p "require('./package.json').version")

          if [ "$IS_TRUNK" = true ]; then
            [ ! -f .changeset/pre.json ] || npx changeset pre exit
          else
            [ -f .changeset/pre.json ] || npx changeset pre enter beta
          fi

          npx changeset version
          npm run versions:update
          VERSION=$(node -p "require('./package.json').version")

          # In pre-release mode, changesets already in a prerelease don't bump again.
          if [ "$VERSION" = "$BEFORE" ]; then
            echo "No new changesets since ${VERSION}."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            npm run makepot
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          fi

      - name: Commit version bump
        if: steps.version.outputs.release == 'true'
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: apply changesets"
          echo "SOURCE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build
        if: steps.version.outputs.release == 'true'
        run: npm run build

      - name: Commit build, tag and push
        if: steps.version.outputs.release == 'true'
        run: |
          # The built commit has the previous built commit (if any) as its first
          # parent and the source commit as its second, so the built branch
          # only ever fast-forwards and every build links back to its source.
          git add -f dist
          TREE=$(git write-tree)
          PARENTS=()
          if git ls-remote --exit-code --heads origin "$BUILT_BRANCH" > /dev/null; then
            git fetch origin "$BUILT_BRANCH"
            PARENTS+=(-p FETCH_HEAD)
          fi
          PARENTS+=(-p "$SOURCE")
          BUILT=$(git commit-tree "$TREE" "${PARENTS[@]}" -m "chore: build ${VERSION}")
          # Unstage dist/ again so later steps work from the clean source commit.
          git reset -q

          git tag "$VERSION" "$BUILT"
          git push --atomic origin "${SOURCE}:refs/heads/${GITHUB_REF_NAME}" "${BUILT}:refs/heads/${BUILT_BRANCH}" "refs/tags/${VERSION}"

      - name: Publish GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          git archive --format=zip --prefix=wp-content-connect/ -o release/wp-content-connect.zip "$VERSION"

          # Release notes are this version's section of the changelog.
          awk -v v="## ${VERSION}" '$0 == v {found=1; next} found && /^## / {exit} found' CHANGELOG.md > release/notes.md

          FLAGS=()
          [ "$IS_TRUNK" = true ] || FLAGS+=(--prerelease)
          gh release create "$VERSION" release/wp-content-connect.zip --verify-tag --title "$VERSION" --notes-file release/notes.md "${FLAGS[@]}"

      - name: Merge trunk back into develop
        if: steps.version.outputs.release == 'true' && env.IS_TRUNK == 'true'
        run: |
          git fetch origin develop
          git checkout -B develop origin/develop

          # Merge the source commit, not the tag: the tag carries dist/.
          if ! git merge --no-ff --no-commit "$SOURCE"; then
            if ! git rev-parse -q --verify MERGE_HEAD > /dev/null; then
              echo "::error::Merging trunk into develop failed before it started."
              exit 1
            fi

            # Changesets merged to develop after the release was cut make the
            # version files conflict. trunk's are authoritative; changesets that
            # only exist on develop stay and go into the next prerelease.
            for file in package.json package-lock.json CHANGELOG.md content-connect.php includes/Plugin.php readme.txt wp-content-connect.pot; do
              git checkout --theirs -- "$file" && git add "$file"
            done
            git rm -q --ignore-unmatch .changeset/pre.json

            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo "::error::trunk could not be merged into develop automatically. Merge it by hand so the next prereleases start from ${VERSION}."
              exit 1
            fi
          fi

          git commit -m "chore: merge trunk into develop"
          git push origin develop
